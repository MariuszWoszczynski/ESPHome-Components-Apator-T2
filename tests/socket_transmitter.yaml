esphome:
  name: test

esp32:
  variant: ${variant}
  framework:
    type: esp-idf

external_components:
  - source: ../components

wifi:
  ssid: TestSSID
  password: TestPass

socket_transmitter:
  id: test_transmitter
  ip_address: 192.168.1.1
  port: 12345
  protocol: TCP

interval:
  - interval: 60s
    then:
      - socket_transmitter.send:
          id: test_transmitter
          data: "test"
