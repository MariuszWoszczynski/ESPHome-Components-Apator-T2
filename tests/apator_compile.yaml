esphome:
  name: apator-compile-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: ../components

logger:

spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1
  miso_pin: GPIO2

wmbus_common:
  drivers:
    - apator162

wmbus_radio:
  id: radio_component
  radio_type: SX1276
  cs_pin: GPIO3
  reset_pin: GPIO4
  irq_pin: GPIO5
  on_apator_programming_result:
    - logger.log:
        format: "Apator result=%s requested=%u read=%u"
        args: [ 'result.c_str()', 'desired_period', 'actual_period' ]
  on_apator_read_result:
    - logger.log:
        format: "Apator read=%s normal=%u economy_hours=%u economy_weekday=%u economy_month_day=%u economy_month=%u"
        args:
          - 'result.c_str()'
          - 'normal_period'
          - 'economy_hours_period'
          - 'economy_weekday_period'
          - 'economy_month_day_period'
          - 'economy_month_period'

button:
  - platform: template
    name: "Read Apator current periods"
    on_press:
      - wmbus_radio.apator_read_periods:
          id: radio_component
          meter_id: "12345678"
          attempts: 3
          power_dbm: 10
  - platform: template
    name: "Arm Apator test period"
    on_press:
      - wmbus_radio.apator_set_period:
          id: radio_component
          meter_id: "12345678"
          period: 60
          attempts: 3
          power_dbm: 10
