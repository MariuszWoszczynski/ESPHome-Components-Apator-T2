esphome:
  name: apator-boot-sim
  on_boot:
    priority: -100
    then:
      - logger.log:
          level: INFO
          format: "APATOR_ACTION_BEGIN"
      - wmbus_radio.apator_set_period:
          id: wmbus_radio_component
          meter_id: "12345678"
          period: 60
          attempts: 1
          power_dbm: 10
      - logger.log:
          level: INFO
          format: "APATOR_ACTION_OK"
      - delay: 1s
      - logger.log:
          level: INFO
          format: "BOOT_SIM_OK"

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

external_components:
  - source: ../components

logger:
  level: DEBUG

spi:
  clk_pin: GPIO33
  mosi_pin: GPIO32
  miso_pin: GPIO19

wmbus_common:
  drivers:
    - name: ultrimis
      fields: all

wmbus_radio:
  id: wmbus_radio_component
  radio_type: SX1276
  cs_pin: GPIO23
  reset_pin: GPIO22
  irq_pin: GPIO21

wmbus_meter:
  - id: water_meter_apator
    meter_id: "12345678"
    type: apator162
    key: "00000000000000000000000000000000"

button:
  - platform: template
    name: "Apator boot simulation period"
    on_press:
      - wmbus_radio.apator_set_period:
          id: wmbus_radio_component
          meter_id: "12345678"
          period: 60
          attempts: 1
          power_dbm: 10
