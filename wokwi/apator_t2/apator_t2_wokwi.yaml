esphome:
  name: apator-t2-wokwi
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - wmbus_radio.apator_set_period:
          id: radio_component
          meter_id: "07208205"
          period: 60
          attempts: 1
          power_dbm: 10

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

external_components:
  - source: ../components

logger:
  level: DEBUG

spi:
  clk_pin: GPIO33
  mosi_pin: GPIO32
  miso_pin: GPIO19

wmbus_common:
  drivers:
    - apator162

wmbus_radio:
  id: radio_component
  radio_type: SX1276
  cs_pin: GPIO23
  reset_pin: GPIO22
  irq_pin: GPIO21
  on_apator_programming_result:
    - logger.log:
        format: "APATOR_WOKWI_RESULT=%s requested=%u read=%u"
        args: [ 'result.c_str()', 'desired_period', 'actual_period' ]

button:
  - platform: template
    name: "Apator Wokwi set period"
    on_press:
      - wmbus_radio.apator_set_period:
          id: radio_component
          meter_id: "07208205"
          period: 60
          attempts: 1
          power_dbm: 10
